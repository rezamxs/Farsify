<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <style>
    @font-face {
      font-family: 'VazirmatnPop';
      src: url('https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/fonts/webfonts/Vazirmatn-Regular.woff2') format('woff2');
    }
    body {
      width: 240px; margin: 0; padding: 16px;
      font-family: 'VazirmatnPop', Tahoma, sans-serif;
      background: #1e1e2e; color: #f5f5f5;
    }
    h1 { font-size: 15px; margin: 0 0 12px; }
    .switch-row {
      display: flex; align-items: center; justify-content: space-between;
      background: #2a2a3c; border-radius: 12px; padding: 12px 14px;
    }
    .switch { position: relative; width: 46px; height: 24px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; inset: 0; background: #555; border-radius: 24px;
      cursor: pointer; transition: .3s;
    }
    .slider:before {
      content: ""; position: absolute; height: 18px; width: 18px;
      right: 3px; top: 3px; background: white; border-radius: 50%; transition: .3s;
    }
    input:checked + .slider { background: #7c5cff; }
    input:checked + .slider:before { transform: translateX(-22px); }
    .hint { font-size: 11px; color: #aaa; margin-top: 10px; line-height: 1.8; }
    .status { font-size: 12px; color: #7c5cff; margin-top: 8px; min-height: 16px; }
  </style>
</head>
<body>
  <h1>🌍 مترجم فارسی</h1>
  <div class="switch-row">
    <span>ترجمه‌ی این صفحه</span>
    <label class="switch">
      <input type="checkbox" id="toggle">
      <span class="slider"></span>
    </label>
  </div>
  <div class="status" id="status"></div>
  <div class="hint">
    متن صفحه به فارسی ترجمه می‌شود با فونت وزیرمتن و چیدمان راست‌به‌چپ. برای برگرداندن، کلید را خاموش کنید.
  </div>
  <script src="popup.js"></script>
</body>
</html>
